name: ai_chat_mobile
description: "AI-Chat-Project Native Mobile Client with Stitch Deep Tech Glass UI"
publish_to: "none"
version: 1.2.0+12

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"


dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # 路由
  go_router: ^14.6.2

  # 网络请求与流式传输
  dio: ^5.7.0

  # 本地持久化与安全存储
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.1.1

  # 富文本渲染与代码语法高亮
  flutter_markdown: ^0.7.4+1
  markdown: ^7.2.2
  flutter_highlighter: ^0.1.1
  webview_flutter: ^4.10.0

  # 工具库
  uuid: ^4.5.1
  intl: ^0.20.1
  url_launcher: ^6.3.1
  flutter_svg: ^2.3.0

  # 多媒体与音频处理
  audioplayers: ^6.1.0
  video_player: ^2.9.2
  record: ^5.2.0
  file_picker: ^8.1.6
  path_provider: ^2.1.5
  cross_file: ^0.3.5+5
  shorebird_code_push: ^2.0.7
  restart_app: ^1.10.1
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.2

dependency_overrides:
  path_provider_android: 2.2.15
  record_platform_interface: 1.6.0
  record_linux: ^1.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - shorebird.yaml
