name: Mobile Release APK Build

on:
  workflow_dispatch:
    inputs:
      target_platform:
        description: 'Target ABI Platform'
        required: true
        default: 'android-arm64'
        type: choice
        options:
          - 'android-arm64'
          - 'android-arm'
          - 'all'
      obfuscate:
        description: 'Enable Dart Obfuscation & Symbol Stripping'
        required: true
        type: boolean
        default: true

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Lightweight Release APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: aiChatMobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests & Verification
        run: |
          flutter analyze
          flutter test

      - name: Build Release APK
        run: |
          BUILD_ARGS="--release"

          if [ "${{ github.event.inputs.target_platform }}" != "all" ]; then
            BUILD_ARGS="$BUILD_ARGS --target-platform=${{ github.event.inputs.target_platform }}"
          fi

          if [ "${{ github.event.inputs.obfuscate }}" = "true" ]; then
            BUILD_ARGS="$BUILD_ARGS --obfuscate --split-debug-info=build/symbols"
          fi

          echo "Executing: flutter build apk $BUILD_ARGS"
          flutter build apk $BUILD_ARGS

          mkdir -p build/dist
          cp build/app/outputs/flutter-apk/*.apk build/dist/
          ls -lh build/dist/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ERJ-Chat-Mobile-${{ github.event.inputs.target_platform }}-Release-APK
          path: aiChatMobile/build/dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Debug Symbols Artifact
        if: ${{ github.event.inputs.obfuscate == true }}
        uses: actions/upload-artifact@v4
        with:
          name: ERJ-Chat-Mobile-Debug-Symbols
          path: aiChatMobile/build/symbols
          retention-days: 30

      - name: Build Summary
        if: always()
        run: |
          echo "### 📱 Lightweight Mobile APK Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Platform**: ${{ github.event.inputs.target_platform }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Dart Obfuscation**: ${{ github.event.inputs.obfuscate }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Job Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact Output**: Ready for download in GitHub Actions Artifacts tab" >> $GITHUB_STEP_SUMMARY
